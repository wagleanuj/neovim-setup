# --- general ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -ga terminal-overrides ",xterm-256color:Tc"

# --- prefix: C-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# --- quit ---
# Q = kill the whole session (with confirm). d = detach (keep running).
bind Q confirm-before -p "kill session '#S'? (y/n)" kill-session
# X = kill just the current window (with confirm)
bind X confirm-before -p "kill window '#W'? (y/n)" kill-window

# --- splits (open in cwd) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- vim-style pane nav ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- status bar (bottom, tokyonight palette) ---
# Shows each window with a per-app icon; active window is highlighted so you can
# see at a glance which is nvim / claude / server / tests / infra / shell.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# session name on the left
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7,nobold] "
set -g status-left-length 40

# per-window icon picked from the window NAME (editor/ai/server/tests/infra, else shell)
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#f7768e,bold]⌘ PREFIX ,}#[fg=#565f89]%a %d %b #[fg=#7aa2f7,bold]%H:%M "
set -g status-right-length 60

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26]  #I #{?#{==:#W,editor}, ,#{?#{==:#W,ai},󰚩 ,#{?#{==:#W,server}, ,#{?#{==:#W,tests}, ,#{?#{==:#W,infra},󰡨 , }}}}}#W  "
setw -g window-status-current-format "#[fg=#7dcfff,bg=#283457,bold]  #I #{?#{==:#W,editor}, ,#{?#{==:#W,ai},󰚩 ,#{?#{==:#W,server}, ,#{?#{==:#W,tests}, ,#{?#{==:#W,infra},󰡨 , }}}}}#W  "
setw -g window-status-activity-style "fg=#e0af68"

# --- plugins (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
